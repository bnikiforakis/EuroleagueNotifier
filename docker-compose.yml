name: euroleague-notifier

services:
  euroleague-notifier:
    build: .
    image: euroleague-notifier:latest
    container_name: euroleague-notifier
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/euroleague_notifier.db
    volumes:
      - notifier-data:/data
    tmpfs:
      - /tmp  # heartbeat file lives in RAM, not on the SD card
    expose:
      - "8081"  # /score callback for PiButler on pibutler-net; deliberately not published to the host
    networks:
      - pibutler-net
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Same code, run for EuroCup: its own PiButler project ("EuroCup" in /settings), own key,
  # own database and /eurocup command. Its schedule and results go out at their own times
  # (default 12:30 / 01:30) so they never arrive together with EuroLeague's.
  eurocup-notifier:
    build: .
    image: euroleague-notifier:latest
    container_name: eurocup-notifier
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/eurocup_notifier.db
      COMPETITIONS: U
      PIBUTLER_PROJECT_ID: eurocup
      PIBUTLER_API_KEY: ${EUROCUP_PIBUTLER_API_KEY:?set EUROCUP_PIBUTLER_API_KEY in .env}
      PROJECT_NAME: EuroCup
      SCORE_COMMAND: eurocup
      CALLBACK_URL: http://eurocup-notifier:8081/pibutler
      DIGEST_TIME: ${EUROCUP_DIGEST_TIME:-12:30}
      RESULTS_TIME: ${EUROCUP_RESULTS_TIME:-01:30}
    volumes:
      - eurocup-data:/data
    tmpfs:
      - /tmp
    expose:
      - "8081"
    networks:
      - pibutler-net
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  notifier-data:
  eurocup-data:

networks:
  pibutler-net:
    external: true  # created by PiButler's compose file; start PiButler first
